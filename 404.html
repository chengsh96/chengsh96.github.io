<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting to shihao-cheng.com</title>
  <link rel="canonical" href="https://shihao-cheng.com/">
  <script>
    const target =
      "https://shihao-cheng.com" +
      window.location.pathname +
      window.location.search +
      window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body>
  <h1>This site has moved</h1>
  <p>
    The page you requested now lives at
    <a href="https://shihao-cheng.com/">https://shihao-cheng.com</a>,
    under the same path.
  </p>
  <noscript>
    <p>
      JavaScript is disabled, so you were not redirected automatically.
      Follow the link above to continue.
    </p>
  </noscript>
</body>
</html>
